name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache ~/.npm and .next/cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            frontend/.next/cache
          key: ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-frontend-${{ hashFiles('frontend/package-lock.json') }}-
            ${{ runner.os }}-frontend-

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - name: Knip report (non-blocking)
        run: npx knip || true
        continue-on-error: true
      - run: npm run build
        env:
          NEXT_PUBLIC_LYRICSFLIP_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          NEXT_PUBLIC_LYRICSFLIP_NFT_CONTRACT_ID: CAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

  ci-summary:
    name: Frontend CI
    if: always()
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Require frontend checks
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "Frontend checks did not pass."
            exit 1
          fi
